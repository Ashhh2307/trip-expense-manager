<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="twBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="planeTopWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="planeRightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="planeKeelLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="planeKeelRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="plane3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#twBgGradient)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <g filter="url(#plane3DShadow)">
    <polygon points="53,12 11,32 30,40" fill="url(#planeTopWing)" />
    <polygon points="53,12 30,40 39,52" fill="url(#planeRightWing)" />
    <polygon points="18,36 24,49 30,40" fill="url(#planeKeelLeft)" />
    <polygon points="30,40 34,47 39,52" fill="url(#planeKeelRight)" />
    <polygon points="53,12 30,40 33,31" fill="#FFFFFF" fill-opacity="0.9" />
  </g>
</svg>
