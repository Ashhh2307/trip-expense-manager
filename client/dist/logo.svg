<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none">
  <defs>
    <linearGradient id="twBgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="planeTopWingFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="planeRightWingFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="planeKeelLeftFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="planeKeelRightFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="plane3DShadowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="15" fill="url(#twBgGradFull)" />
    <rect x="0" y="0" width="56" height="56" rx="15" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

    <g filter="url(#plane3DShadowFull)">
      <polygon points="47,10 9,28 26,35" fill="url(#planeTopWingFull)" />
      <polygon points="47,10 26,35 34,46" fill="url(#planeRightWingFull)" />
      <polygon points="15,31 20,43 26,35" fill="url(#planeKeelLeftFull)" />
      <polygon points="26,35 30,41 34,46" fill="url(#planeKeelRightFull)" />
      <polygon points="47,10 26,35 29,27" fill="#FFFFFF" fill-opacity="0.9" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 15)">
    <text x="0" y="23" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="23" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      Travel<tspan fill="#059669">Wise</tspan>
    </text>
    <text x="0" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">
      PREMIUM EXPENSE TRACKER
    </text>
  </g>
</svg>
