<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#ffffff" rx="16"/>
  <rect x="20" y="20" width="560" height="760" fill="#fafafa" stroke="#e2e8f0" stroke-width="2" rx="12"/>
  
  <!-- Header -->
  <text x="300" y="80" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">TRAVEL RECEIPT</text>
  <text x="300" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Official Expense Verification</text>
  <line x1="50" y1="135" x2="550" y2="135" stroke="#cbd5e1" stroke-dasharray="6,6" stroke-width="2"/>
  
  <!-- Receipt Meta -->
  <text x="60" y="175" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">MERCHANT:</text>
  <text x="200" y="175" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Air India Ltd.</text>
  
  <text x="60" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">TRANSACTION DATE:</text>
  <text x="200" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Oct 24, 2023 08:30 AM</text>
  
  <text x="60" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">CATEGORY:</text>
  <text x="200" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Flight / Airfare</text>
  
  <text x="60" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">TRIP REFERENCE:</text>
  <text x="200" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">London Q4 Review (BOM -> LHR)</text>

  <line x1="50" y1="315" x2="550" y2="315" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Line items -->
  <text x="60" y="355" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Description</text>
  <text x="540" y="355" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">Amount</text>

  <text x="60" y="395" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Air India Ticket - BOM to LHR (Economy Plus)</text>
  <text x="540" y="395" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="end">₹43,500.00</text>

  <text x="60" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Airport User Dev Fee &amp; Aviation Taxes</text>
  <text x="540" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="end">₹5,000.00</text>

  <line x1="50" y1="465" x2="550" y2="465" stroke="#cbd5e1" stroke-dasharray="6,6" stroke-width="2"/>

  <!-- Total -->
  <text x="60" y="510" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">TOTAL PAID</text>
  <text x="540" y="510" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="end">₹48,500.00</text>

  <text x="60" y="540" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Payment Method: HDFC Corporate Card ending in 4821</text>
  <text x="60" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Status: VERIFIED &amp; APPROVED</text>

  <!-- Barcode representation -->
  <rect x="150" y="610" width="300" height="60" fill="#0f172a" rx="4"/>
  <text x="300" y="645" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">||| | |||| || ||||| || ||||</text>
  <text x="300" y="695" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">AUTH-AI-89472910-BOM-LON</text>

  <text x="300" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Thank you for flying with Air India. TravelWise verified.</text>
</svg>
